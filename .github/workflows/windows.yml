# Builds piccolo for Windows natively with MSYS2, runs the tests, and uploads
# the piccolo folder (GitHub serves it as a zip):
#   x86_64: UCRT64 (GCC + libstdc++ + the Universal CRT), the toolchain used to
#           build it by hand on Windows.
#   ARM64:  CLANGARM64 (clang + libc++ + the Universal CRT) on GitHub's
#           Windows ARM runner; MSYS2 has no GCC for ARM64.
# The C/C++ runtimes are linked statically, so piccolo.exe only needs Windows'
# own DLLs, vulkan-1.dll (installed with the GPU driver) and OpenSSL's
# libssl / libcrypto (WebRTC, deps/libdatachannel), copied next to it.
name: Windows

# Tags: release.yml calls this workflow for v* tags (workflow_call).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    name: Windows (${{ matrix.msystem }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: UCRT64
            arch: x86_64
            runner: windows-latest
          - msystem: CLANGARM64
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Checked out with LF endings: the themes, layouts and translations are
      # copied as they are.
      - run: git config --global core.autocrlf false
        shell: pwsh

      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          # pacboy adds the environment's prefix; cc is GCC on UCRT64, clang on CLANGARM64.
          install: git
          pacboy: >-
            cc:p
            cmake:p
            ninja:p
            vulkan-devel:p
            openssl:p
            ntldd:p

      # Only the submodules the build uses.
      # deps/librashader without --recursive: its own submodules are tests.
      # deps/libdatachannel with --recursive: plog, usrsctp and libjuice.
      - name: Submodules
        run: |
          git submodule update --init --recursive --depth 1 \
            deps/SDL deps/imgui deps/libretro-common deps/libsamplerate \
            deps/gamemode deps/miniz deps/7zip deps/enet deps/monocypher deps/beacon \
            deps/piccolo-shaders deps/piccolo-shaders-legacy \
            deps/common/hosts-common deps/common/frontends-common deps/common/retroui \
            deps/libretro/host-libretro deps/libretro/frontend-libretro \
            deps/libdatachannel
          git submodule update --init --depth 1 deps/librashader
          # Test libretro ships in every package. Its nested submodules
          # (imguisw's) have SSH URLs: fetched over HTTPS instead.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --checkout --depth 1 deps/test-libretro

      # Shared and module libraries (test_libretro.dll is a MODULE) get the
      # static runtime too. The core downloader uses WinHTTP (Windows' own),
      # never MSYS2's curl: the DLL check below rejects libcurl.
      # Release without warnings as errors (GCC -O2 gives two harmless ones).
      # MULTITAP_PICCOLO_DIR is the folder that's uploaded: the build copies
      # piccolo.exe, lang/, layouts/, themes/ and shaders/ there.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMULTITAP_PICCOLO_DIR="$PWD/dist/piccolo" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCMAKE_MODULE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"

      - name: Build
        run: cmake --build build

      # The DLLs piccolo.exe still links from MSYS2 (OpenSSL) go next to it:
      # every DLL ntldd resolves to the environment's bin folder, three passes
      # so the DLLs just copied are followed too. Not vulkan-1.dll: the
      # driver's loader must win (Windows looks in piccolo's folder first).
      - name: Copy MSYS2 DLLs
        run: |
          msys_bin=$(cygpath -w "$MSYSTEM_PREFIX/bin")
          cd dist/piccolo
          for i in $(seq 3); do
            for bin in $(ntldd -R *.exe | grep -iF "$msys_bin" | grep -iv 'vulkan-1\.dll' | cut -d">" -f2 | cut -d" " -f2); do
              cp -vu "$bin" .
            done
          done

      # MULTITAP_NET_HTTP_ONLINE_URL: net_http_test also downloads over the
      # network (WinHTTP, TLS by Schannel) from the cores site.
      - name: Test
        env:
          MULTITAP_NET_HTTP_ONLINE_URL: https://cores.get-piccolo.app/v1/index/windows-x86_64.cfg
        run: ctest --test-dir build --output-on-failure

      # librashader (shader presets), which piccolo loads at run time from its
      # own folder: only the C API with the Vulkan runtime. Built with the
      # runner's Rust (MSVC target; the C API doesn't care which compiler
      # built piccolo.exe), with the C runtime linked statically so the DLL
      # needs no Visual C++ redistributable.
      - name: librashader
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          CARGO_TARGET_DIR: ${{ github.workspace }}/build-librashader
        run: |
          cargo build --manifest-path deps/librashader/Cargo.toml -p librashader-capi --release --locked --no-default-features --features runtime-vulkan
          Copy-Item build-librashader/release/librashader_capi.dll dist/piccolo/librashader.dll
          Copy-Item deps/librashader/LICENSE.md dist/piccolo/librashader-LICENSE.md

      # Fails if piccolo.exe needs a C/C++ runtime or SDL DLL from MSYS2, or a
      # DLL from MSYS2 that isn't in its folder (only OpenSSL's are allowed,
      # copied above; vulkan-1.dll comes with the driver), or librashader.dll
      # a C/C++ runtime DLL.
      - name: Check DLL dependencies
        run: |
          objdump=$(command -v objdump || command -v llvm-objdump)
          "$objdump" -p dist/piccolo/piccolo.exe | grep 'DLL Name' | tee dlls.txt
          if grep -iE 'libstdc|libgcc|libwinpthread|libc\+\+|libunwind|libcurl|SDL3' dlls.txt; then
            echo "piccolo.exe depends on MSYS2 DLLs"
            exit 1
          fi
          # Run from piccolo's folder its own DLLs win, so anything still
          # resolved to MSYS2's bin folder is missing from the package.
          msys_bin=$(cygpath -w "$MSYSTEM_PREFIX/bin")
          (cd dist/piccolo && ntldd -R piccolo.exe) | tee ntldd.txt
          if grep -iF "$msys_bin" ntldd.txt | grep -iv 'vulkan-1\.dll'; then
            echo "piccolo.exe needs MSYS2 DLLs that aren't in its folder"
            exit 1
          fi
          # Test libretro ships in every package, in piccolo's cores folder.
          "$objdump" -p dist/piccolo/cores/test_libretro.dll | grep 'DLL Name' | tee test-core-dlls.txt
          if grep -iE 'libstdc|libgcc|libwinpthread|libc\+\+|libunwind' test-core-dlls.txt; then
            echo "test_libretro.dll depends on MSYS2 DLLs"
            exit 1
          fi
          "$objdump" -p dist/piccolo/librashader.dll | grep 'DLL Name' | tee rashader-dlls.txt
          if grep -iE 'vcruntime|msvcp|api-ms-win-crt|libstdc|libgcc' rashader-dlls.txt; then
            echo "librashader.dll depends on a C/C++ runtime DLL"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: piccolo-windows-${{ matrix.arch }}
          path: dist/
