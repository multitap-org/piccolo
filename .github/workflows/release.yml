# A v* tag becomes a GitHub Release with every package and a manifest.cfg;
# cores-server's publish-apps.sh pulls it from there into
# https://releases.get-piccolo.app (signed index for the update indicator,
# stable names for get-piccolo.app's links).
#
#   vX.Y.Z          stable channel
#   vX.Y.Z-beta.N   prerelease, beta channel
#
# Every push to main is a snapshot (Andrés, 2026-11-27): version
# <base>-snapshot.<date>.<commit> (tools/snapshot-suffix.sh), and the same
# files replace those of one rolling prerelease, tag `snapshot`, with a
# snapshot.cfg instead of manifest.cfg (same format, tag=snapshot, plus
# commit). publish-apps.sh signs each one with the snapshot key, serves it as
# latest and keeps the last one of each day. A manual run on another branch
# builds the same way and publishes nothing.
#
# It builds through the usual workflows (workflow_call), so a release is
# exactly what CI builds on main. Assets, piccolo-<version>-<target>.<ext>:
#   windows-x86_64.zip  windows-arm64.zip
#   linux-x86_64.flatpak  linux-aarch64.flatpak
#   android-arm64-v8a.apk  android-armeabi-v7a-legacy.apk
#   web.zip
# manifest.cfg: app, version, tag, then one [<target>] block per asset with
# asset, size, sha256, and exe_sha256, the hash of what the program checks
# itself by (frontends-common net_build.h): the executable on Windows and
# Linux, the native activity's lib/<abi>/libmain.so in the APKs, the zip's
# wasm.sha256 (every core's piccolo.wasm and its hash) for the web. The
# releases server signs a record of it, a build's proof that it's official
# (the format publish-apps.sh reads).
#
# Refuses to release without the Android release key in the secrets (never a
# debug APK in a release) or when the tag doesn't match PICCOLO_VERSION_BASE;
# a snapshot without the key is built but not published.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One at a time per branch or tag; a newer push waits for the one running
# (a snapshot that was built gets published).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Version and release key
        id: version
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          base=$(sed -n 's/^set(PICCOLO_VERSION_BASE \([^)]*\))$/\1/p' CMakeLists.txt)
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
            if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
              echo "tag $tag is not vX.Y.Z or vX.Y.Z-beta.N"
              exit 1
            fi
            case "$version" in
              "$base"|"$base".*|"$base"-*) ;;
              *) echo "tag $tag doesn't match PICCOLO_VERSION_BASE $base in CMakeLists.txt"; exit 1 ;;
            esac
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
              echo "no Android release key in the secrets: a release never ships a debug APK"
              exit 1
            fi
            publish=true
          else
            # The same suffix the build jobs write (their "Snapshot version" step).
            version="$base-$(tools/snapshot-suffix.sh)"
            publish=false
            if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
              publish=true
              if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
                echo "no Android release key in the secrets: this snapshot is built, not published"
                publish=false
              fi
            fi
          fi
          echo "version $version, publish $publish"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  android:
    needs: check
    uses: ./.github/workflows/android.yml
    secrets: inherit

  flatpak:
    needs: check
    uses: ./.github/workflows/flatpak.yml

  windows:
    needs: check
    uses: ./.github/workflows/windows.yml

  web:
    needs: check
    uses: ./.github/workflows/web.yml
    secrets: inherit   # main's run redeploys play/ (PORTAINER_WEBHOOK)
    permissions:
      contents: read
      packages: write   # web.yml pushes the image's :main, or a tag's :<version> and :latest

  release:
    name: GitHub Release
    needs: [check, android, flatpak, windows, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write   # the Web run on main at the end
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Artifacts are found by file name, not by artifact name (the Flatpak
      # action names its own).
      # The Flatpaks' program is read from the bundle with ostree (exe_sha256).
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q flatpak ostree

      - name: Release files
        run: |
          version="${{ needs.check.outputs.version }}"
          mkdir release
          find artifacts -type f | sort

          one() {   # one <find -name pattern>: exactly one file
            found=$(find artifacts -type f -name "$1")
            if [ "$(echo "$found" | grep -c .)" != 1 ]; then
              echo "expected one $1, found: $found"
              exit 1
            fi
            echo "$found"
          }
          # exe_hash TARGET FILE: the program's own hash, for exe_sha256.
          : > exe_hashes
          exe_hash() {
            echo "$1 $(sha256sum "$2" | cut -d ' ' -f 1)" >> exe_hashes
          }
          # flatpak_exe_hash TARGET BUNDLE PATH: the same for a file inside a Flatpak bundle.
          flatpak_exe_hash() {
            repo=$(mktemp -d)
            ostree init --repo="$repo" --mode=archive-z2
            flatpak build-import-bundle --no-update-summary "$repo" "$2"
            ref=$(ostree refs --repo="$repo" | grep '^app/' | head -n 1)
            [ -n "$ref" ] || { echo "no app in $2"; exit 1; }
            ostree cat --repo="$repo" "$ref" "$3" > "$repo/exe" || { echo "no $3 in $2"; exit 1; }
            exe_hash "$1" "$repo/exe"
            rm -rf "$repo"
          }
          for arch in x86_64 arm64; do
            dir=$(find artifacts -type d -path "*piccolo-windows-$arch/piccolo")
            [ -n "$dir" ] || { echo "no Windows $arch folder"; exit 1; }
            (cd "$dir/.." && zip -q -r -9 "$GITHUB_WORKSPACE/release/piccolo-$version-windows-$arch.zip" piccolo)
            exe_hash "windows-$arch" "$dir/piccolo.exe"
          done
          for arch in x86_64 aarch64; do
            cp "$(one "piccolo-$arch.flatpak")" "release/piccolo-$version-linux-$arch.flatpak"
            flatpak_exe_hash "linux-$arch" "release/piccolo-$version-linux-$arch.flatpak" /files/lib/piccolo/piccolo
          done
          # zip_exe_hash TARGET ZIP PATTERN: the same for the one file in a zip (an APK) matching PATTERN.
          zip_exe_hash() {
            dir=$(mktemp -d)
            unzip -q "$2" "$3" -d "$dir" || { echo "no $3 in $2"; exit 1; }
            found=$(find "$dir" -type f)
            [ "$(echo "$found" | grep -c .)" = 1 ] || { echo "expected one $3 in $2, found: $found"; exit 1; }
            exe_hash "$1" "$found"
            rm -rf "$dir"
          }
          cp "$(one piccolo.apk)" "release/piccolo-$version-android-arm64-v8a.apk"
          cp "$(one piccolo-legacy.apk)" "release/piccolo-$version-android-armeabi-v7a-legacy.apk"
          zip_exe_hash android-arm64-v8a "release/piccolo-$version-android-arm64-v8a.apk" 'lib/arm64-v8a/libmain.so'
          zip_exe_hash android-armeabi-v7a-legacy "release/piccolo-$version-android-armeabi-v7a-legacy.apk" 'lib/*/libmain.so'
          cp "$(one '*-web.zip')" "release/piccolo-$version-web.zip"
          # The web build's list must name the wasm files it ships, as they are.
          web=$(mktemp -d)
          unzip -q "release/piccolo-$version-web.zip" -d "$web"
          (cd "$web"/piccolo-*-web && sha256sum --quiet -c wasm.sha256) || { echo "wasm.sha256 doesn't match the web zip"; exit 1; }
          exe_hash web "$(echo "$web"/piccolo-*-web/wasm.sha256)"

          if [ "${{ github.ref_type }}" = tag ]; then
            manifest=release/manifest.cfg
            {
              echo "# piccolo ${{ github.ref_name }}: the release's files (release.yml)"
              echo "app=piccolo"
              echo "version=$version"
              echo "tag=${{ github.ref_name }}"
            } > "$manifest"
          else
            manifest=release/snapshot.cfg
            {
              echo "# piccolo snapshot $version: main's build (release.yml)"
              echo "app=piccolo"
              echo "version=$version"
              echo "tag=snapshot"
              echo "commit=${{ github.sha }}"
            } > "$manifest"
          fi
          for file in release/piccolo-*; do
            asset="${file#release/}"
            target="${asset#piccolo-$version-}"
            target="${target%.*}"
            {
              echo ""
              echo "[$target]"
              echo "asset=$asset"
              echo "size=$(stat -c %s "$file")"
              echo "sha256=$(sha256sum "$file" | cut -d ' ' -f 1)"
              exe=$(awk -v t="$target" '$1 == t { print $2 }' exe_hashes)
              if [ -n "$exe" ]; then
                echo "exe_sha256=$exe"
              fi
            } >> "$manifest"
          done
          cat "$manifest"

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          flags="--latest"
          case "$tag" in
            *-beta.*) flags="--prerelease" ;;
          esac
          gh release create "$tag" release/* --repo "${{ github.repository }}" \
            --title "piccolo ${tag#v}" --verify-tag --generate-notes $flags

      # get-piccolo.app/play/ shows the latest release beside main's build
      # (web.yml, web/channels.sh): a Web run on main takes this release's
      # web.zip and redeploys. Not for a beta: it isn't the latest release.
      # The rolling `snapshot` prerelease: the tag moves to this commit, the
      # new files go up first, snapshot.cfg (what publish-apps.sh reads) next,
      # and the previous snapshot's files go last. Never marked latest.
      - name: Replace the snapshot
        if: github.ref_type == 'branch' && needs.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/git/refs/tags/snapshot" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/snapshot" -f sha="${{ github.sha }}" -F force=true > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/snapshot -f sha="${{ github.sha }}" > /dev/null
          fi
          notes="main's latest build, ${{ needs.check.outputs.version }} (${{ github.sha }}). Replaced by every push to main; releases.get-piccolo.app signs and keeps them."
          if ! gh release view snapshot --repo "$REPO" > /dev/null 2>&1; then
            gh release create snapshot --repo "$REPO" --title "piccolo snapshot" --notes "$notes" --prerelease --latest=false
          fi
          old=$(gh release view snapshot --repo "$REPO" --json assets --jq '.assets[].name')
          gh release upload snapshot --repo "$REPO" --clobber $(ls release/piccolo-*)
          gh release upload snapshot --repo "$REPO" --clobber release/snapshot.cfg
          gh release edit snapshot --repo "$REPO" --title "piccolo snapshot" --notes "$notes" --prerelease --latest=false
          for name in $old; do
            [ -f "release/$name" ] || gh release delete-asset snapshot "$name" --repo "$REPO" --yes
          done

      - name: Rebuild play/ with this release
        if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-beta.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web.yml --repo "${{ github.repository }}" --ref main
