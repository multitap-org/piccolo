# Builds piccolo for the browser (web/build-core.sh, web/build.sh,
# web/package.sh: the same scripts as on the development machine) and uploads
# the zip that deploys by unzipping on any static server (artifact
# piccolo-web). Also builds the Docker image that serves it with the COOP/COEP
# headers its threads need, checks those headers from a running container,
# and publishes it to GHCR (Andrés, 2026-11-20) on pushes to main and on tags,
# never from pull requests:
#   ghcr.io/multitap-org/piccolo-web:main      every push to main: the latest release at /,
#                                              main's build at /dev/ (web/channels.sh)
#   ghcr.io/multitap-org/piccolo-web:<tag>     a tag (v0.4.0 -> 0.4.0), plus :latest
#   docker run --rm -p 8080:80 ghcr.io/multitap-org/piccolo-web   -> http://localhost:8080/
name: Web

# Tags: release.yml calls this workflow for v* tags (workflow_call).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  EMSDK_VERSION: 6.0.13   # multitap-org/cores' web job builds with the same one

jobs:
  web:
    name: Web (wasm)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # the GHCR push (main and tags only)
    steps:
      - uses: actions/checkout@v4

      # The submodules the build uses (the package copies their licenses too).
      - name: Submodules
        run: |
          git submodule update --init --recursive --depth 1 \
            deps/SDL deps/imgui deps/libretro-common deps/libsamplerate \
            deps/gamemode deps/miniz deps/7zip deps/enet deps/monocypher deps/qrcodegen deps/beacon \
            deps/piccolo-shaders deps/piccolo-shaders-legacy \
            deps/common/hosts-common deps/common/multitap-net deps/common/frontends-common deps/common/retroui \
            deps/libretro/host-libretro deps/libretro/frontend-libretro
          git submodule update --init --depth 1 deps/librashader
          # The cores' recipes (web/build-core.sh), and of its own submodules
          # libretro-common: piccobots (built from source here) needs its libretro.h.
          git submodule update --init --checkout deps/cores
          git -C deps/cores submodule update --init --depth 1 deps/libretro-common

      # Ninja; the Vulkan headers (web/build.sh: frontends-common's headers name
      # Vulkan types even with Vulkan off); bison + libpng for the cores repo to
      # build rgbds (SameBoy's boot ROMs); zip.
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libvulkan-dev bison libpng-dev zip

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: web-tools-emsdk-${{ env.EMSDK_VERSION }}

      - name: emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      # piccoletto (its own repository), in the same zip as piccoletto/: built
      # from its main once that has a browser build (web/build.sh).
      - uses: actions/checkout@v4
        with:
          repository: multitap-org/piccoletto
          ref: main
          path: piccoletto-src
          submodules: recursive

      - name: Build and package
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          for core in sameboy snes9x piccobots; do
            web/build-core.sh "$core"
            web/build.sh "$core"
          done
          if [ -f piccoletto-src/web/build.sh ]; then
            piccoletto-src/web/build.sh
            export PICCOLETTO="$PWD/piccoletto-src"
          else
            echo "piccoletto's main has no browser build yet: the zip has none"
          fi
          # The channel the pages say: stable for a release tag, dev otherwise.
          if [ "${{ github.ref_type }}" = tag ]; then export PICCOLO_WEB_CHANNEL=stable; else export PICCOLO_WEB_CHANNEL=dev; fi
          web/package.sh
          ls -la web/build/dist

      # Not a tag: the site is the latest release (its web.zip, from the GitHub
      # Release) with this build under dev/, and the start pages show
      # RELEASE | DEV (web/channels.sh). Before the first release this build
      # is the whole site. A tag's image is that release alone.
      - name: Release and dev in one site
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist=$(find web/build/dist -mindepth 1 -maxdepth 1 -type d -name 'piccolo-*-web' | head -n 1)
          mkdir release-zip
          if gh release download --repo "${{ github.repository }}" --pattern 'piccolo-*-web.zip' --dir release-zip; then
            web/channels.sh "$dist" web/build/site release-zip/piccolo-*-web.zip
          else
            echo "no release with a web.zip yet: the dev build alone"
            web/channels.sh "$dist" web/build/site
          fi

      # The image is built from the unzipped folder: the same files as the zip.
      # Then a container serves it and the headers are checked: COOP/COEP on
      # the page, application/wasm on the wasm.
      - name: Docker image
        run: |
          dist=$(find web/build/dist -mindepth 1 -maxdepth 1 -type d -name 'piccolo-*-web' | head -n 1)
          if [ -d web/build/site ]; then dist=web/build/site; fi
          # The source label links the package to this repository on GitHub.
          docker build -t piccolo-web -f web/docker/Dockerfile --build-context config=web/docker \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.description="piccolo in the browser, served with COOP/COEP" \
            --label org.opencontainers.image.licenses=MIT \
            "$dist"
          docker run -d --rm --name piccolo-web -p 8080:80 piccolo-web
          sleep 2
          curl -fsSI http://localhost:8080/sameboy/ | tee page-headers.txt
          curl -fsSI http://localhost:8080/sameboy/piccolo.wasm | tee wasm-headers.txt
          curl -fsSI http://localhost:8080/snes9x/piccolo.wasm > /dev/null
          curl -fsSI http://localhost:8080/_site/v1/site.css | tee css-headers.txt
          # get-piccolo.app/play/ keeps the path: the same files under /play/.
          curl -fsSI http://localhost:8080/play/sameboy/ | tee play-headers.txt
          curl -fsSI http://localhost:8080/play/sameboy/piccolo.wasm > /dev/null
          curl -fsSI http://localhost:8080/play/piccoletto/ > /dev/null
          curl -sI http://localhost:8080/play/sameboy | tee play-redirect.txt
          # Both builds (web/channels.sh): channels.json, and dev/ when there is a release.
          if [ -f "$dist/channels.json" ]; then
            curl -fsS http://localhost:8080/play/channels.json
          fi
          if [ -d "$dist/dev" ]; then
            curl -fsSI http://localhost:8080/play/dev/sameboy/ | tee dev-headers.txt
            curl -fsSI http://localhost:8080/play/dev/sameboy/piccolo.wasm > /dev/null
            grep -qi '^cross-origin-embedder-policy: require-corp' dev-headers.txt
          fi
          docker stop piccolo-web
          grep -qi '^cross-origin-opener-policy: same-origin' page-headers.txt
          grep -qi '^cross-origin-embedder-policy: require-corp' page-headers.txt
          grep -qi '^content-type: application/wasm' wasm-headers.txt
          grep -qi '^content-type: text/css' css-headers.txt
          grep -qi '^cross-origin-embedder-policy: require-corp' play-headers.txt
          grep -qi '^location: /play/sameboy/' play-redirect.txt

      # Pushes, and a manual run on main (gh workflow run web.yml --ref main:
      # a change only in piccoletto's main, which this build takes).
      - name: Publish the image (GHCR)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/piccolo-web"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "${{ github.ref_type }}" = tag ]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
            tags="$version latest"
          else
            tags="main"
          fi
          for tag in $tags; do
            docker tag piccolo-web "$image:$tag"
            docker push "$image:$tag"
          done
          docker logout ghcr.io

      - uses: actions/upload-artifact@v4
        with:
          name: piccolo-web
          path: web/build/dist/*.zip

  # Redeploys get-piccolo.app/play/ (the piccolo-web stack on the Multitap VPS)
  # once :main is on GHCR: Portainer's stack webhook re-pulls the image and
  # recreates the container. The webhook URL is the PORTAINER_WEBHOOK secret
  # (the URL is the credential); without it the job does nothing. Tag builds
  # come through release.yml without secrets, so they don't redeploy.
  deploy:
    needs: web
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Call the Portainer webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "PORTAINER_WEBHOOK is not set: nothing to deploy"
            exit 0
          fi
          curl -fsS -X POST --retry 3 --retry-all-errors --max-time 120 -o /dev/null -w "HTTP %{http_code}\n" "$WEBHOOK"
