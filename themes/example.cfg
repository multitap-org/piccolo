# EXAMPLE: the reference of every key a theme can set, with the values of
# 8-BIT GRAY (built in: THEME lists it without this file).
#
# A theme is a .cfg file in the themes folder, next to the program or in
# piccolo's own folder (the one with settings/ in it): copy this one, rename
# it, change the colors. SETTINGS > INTERFACE > THEME lists it by its name.
# A theme in piccolo's folder with the same name as one next to the program
# replaces it.
#
# A look made color by color in SETTINGS > INTERFACE is kept with SAVE
# THEME, which writes a file like this one (piccolo.cfg only names the theme:
# ui_theme). Colors are #RRGGBB. A key left out keeps BLUE's value.
#
# Give every element a face of its own: a button, a window, a field or a
# card the color of what it sits on shows only its label.

name = EXAMPLE

# Switches: true or false. (A # starts a comment only at the start of a line.)
# a box behind each menu title on the bar
ui_menu_boxes = false
# drop shadows under windows, menus and menu text
ui_shadows = false
# piccolo's own pixel arrow instead of the system's
ui_theme_cursor = false

# Levels: a number from 0 to 100.
# how much of the game shows through the background while the menu is up
ui_background_transparency = 40
# the touch gamepad's faces: how solid they start (the user's own FILL OPACITY wins once set)
ui_pad_fill = 80
# the touch gamepad's outlines
ui_pad_border = 80
# the touch gamepad's labels and sticks' middles
ui_pad_labels = 80
# the pad_background layer over the space the game leaves empty
ui_pad_background = 100

# behind the menu, and over the game (see above) while the menu is up
ui_color_background = #5E5C6C
# the menu bar, top and bottom
ui_color_bar = #1A1A1C
# the menu bar's middle (a gradient; the same = flat)
ui_color_bar_center = #1A1A1C
# the bar's raised edge
ui_color_bar_light = #34333C
# the bar's dark edge
ui_color_bar_dark = #B5121B
# the box behind each menu title (with ui_menu_boxes)
ui_color_menu_box = #1A1A1C
# its raised edge, also an open menu's
ui_color_menu_box_light = #BDBDC1
# its dark edge
ui_color_menu_box_dark = #BDBDC1
# an open menu's background
ui_color_menu = #4F4C5A
# windows
ui_color_window = #4F4C5A
# windows' light edge
ui_color_window_light = #BDBDC1
# windows' dark edge
ui_color_window_dark = #1A1A1C
# fields, lists, inactive tabs
ui_color_field = #1A1A1C
# a field under the mouse
ui_color_field_hover = #2A2A30
# hovered / selected / pressed
ui_color_highlight = #B5121B
# text
ui_color_text = #F4F4F6
# text on the highlight
ui_color_text_highlight = #FFFFFF
# disabled text
ui_color_text_disabled = #A09EAA
# menu text's shadow (windows' shadows too, at 25%)
ui_color_text_shadow = #1A1A1C
# window title bars, top
ui_color_title = #1A1A1C
# window title bars, bottom (the same = flat)
ui_color_title_bottom = #1A1A1C
# check marks
ui_color_check = #E86A62
# section titles in windows
ui_color_section = #E86A62
# buttons, check boxes, scroll bar grips: top
ui_color_button = #6A6876
# their bottom (the same = flat)
ui_color_button_bottom = #6A6876
# their light edge (the same as dark = no raised edges)
ui_color_button_light = #BDBDC1
# their dark edge
ui_color_button_dark = #34333C
# text on buttons
ui_color_button_text = #F4F4F6
# text in fields and combo boxes
ui_color_field_text = #F4F4F6
# the theme's mouse cursor (with ui_theme_cursor)
ui_color_cursor = #F4F4F6
# its top and right edge (the same = flat)
ui_color_cursor_edge = #B5121B
# the empty space around the game while the touch gamepad shows (ui_pad_background: how solid)
ui_color_pad_background = #BDBDC1
# the touch gamepad's d-pad (ui_pad_fill: how solid)
ui_color_pad_dpad = #1A1A1C
# the d-pad while a finger holds it
ui_color_pad_dpad_held = #6A6876
# its arrows (ui_pad_labels)
ui_color_pad_dpad_text = #6A6876
# the A button
ui_color_pad_a = #B5121B
# A while held
ui_color_pad_a_held = #E03A3E
# its label
ui_color_pad_a_text = #F4F4F6
# the B button
ui_color_pad_b = #B5121B
# B while held
ui_color_pad_b_held = #E03A3E
# its label
ui_color_pad_b_text = #F4F4F6
# the X button
ui_color_pad_x = #B5121B
# X while held
ui_color_pad_x_held = #E03A3E
# its label
ui_color_pad_x_text = #F4F4F6
# the Y button
ui_color_pad_y = #B5121B
# Y while held
ui_color_pad_y_held = #E03A3E
# its label
ui_color_pad_y_text = #F4F4F6
# the shoulder buttons (L, R, L2, R2)
ui_color_pad_shoulder = #1A1A1C
# the shoulder buttons while held
ui_color_pad_shoulder_held = #6A6876
# their labels
ui_color_pad_shoulder_text = #BDBDC1
# the sticks
ui_color_pad_stick = #1A1A1C
# a stick while held
ui_color_pad_stick_held = #34333C
# a stick's middle, the part that follows the finger
ui_color_pad_stick_nub = #6A6876
# SELECT, START and the menu button
ui_color_pad_center = #6A6876
# them while held
ui_color_pad_center_held = #1A1A1C
# their labels
ui_color_pad_center_text = #F4F4F6
# the outlines around every button (ui_pad_border: how solid)
ui_color_pad_border = #1A1A1C
