<!doctype html>
<!-- piccolo in the browser: choose the emulator. One folder per core
     (web/package.sh), each a piccolo built with that core linked in. Where
     the site has two builds (web/channels.sh: the latest release and main's),
     RELEASE | DEV at the top goes from one to the other. The
     look is piccolo's websites' (_site/v1, copied in by web/package.sh;
     the sites bar and footer are filled in between their markers). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="web_page_title">piccolo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png">
<link rel="stylesheet" href="_site/v1/site.css">
<style>
  main.wrap { padding-top: 40px; padding-bottom: 48px; }
  .intro { max-width: 46em; color: var(--muted); margin: 0 0 28px; }
  .cores { display: grid; gap: 18px; margin-bottom: 32px; }
  a.core { display: flex; align-items: center; gap: 18px; padding: 18px 22px; text-decoration: none; color: var(--text);
           border-left: 6px solid var(--edge); }
  a.core:hover { color: var(--text); border-left-color: var(--accent); transform: translate(2px, 2px); box-shadow: 4px 4px 0 var(--shadow); }
  a.core b { display: block; font: 600 24px/1.2 var(--font-heading); }
  a.core span { display: block; color: var(--muted); font-size: 14px; }
  a.core .go { margin-left: auto; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--heading-accent); white-space: nowrap; }
  /* piccoletto isn't an emulator: its own block below the cores. */
  .companion { display: grid; gap: 12px; margin: 8px 0 32px; padding-top: 28px; border-top: 2px solid var(--shadow); }
  .companion h2 { margin: 0; font-size: 26px; text-shadow: none; }
  .companion p { margin: 0; max-width: 46em; color: var(--muted); }
  .notes { color: var(--muted); font-size: 14px; max-width: 46em; }
  .notes p { margin: 0 0 8px; }
  #drop-hint { background: var(--accent); color: var(--on-accent); padding: 10px 14px; font-weight: 700; }
  /* RELEASE | DEV (channels.json, web/channels.sh): the build shown is the lit one. */
  .channels { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 28px; }
  .channels .label { margin: 0; }
  .channels .choice { display: flex; border: 2px solid var(--edge); }
  .channels .choice a { padding: 8px 18px; text-decoration: none; color: var(--text);
             font: 700 13px/1.4 var(--font-text); letter-spacing: 0.08em; text-transform: uppercase; }
  .channels .choice a + a { border-left: 2px solid var(--edge); }
  .channels .choice a:hover { color: var(--heading-accent); }
  .channels .choice a[aria-current] { background: var(--accent); color: var(--on-accent); }
  .channels .choice a[aria-disabled] { color: var(--muted); cursor: default; }
  .channels small { font: 400 12px/1.4 var(--font-text); letter-spacing: 0; text-transform: none; opacity: 0.8; margin-left: 6px; }
  .channel { display: inline-block; margin-left: 10px; padding: 2px 8px; vertical-align: middle; background: var(--accent);
             color: var(--on-accent); font: 700 12px/1.4 var(--font-text); letter-spacing: 0.08em; text-shadow: none; }
</style>
</head>
<body data-site="play" data-channel="@CHANNEL@">
<!-- sites-header filled in by web/package.sh -->
<!-- /sites-header -->
<main class="wrap">
  <h1><span data-i18n="web_play_title"></span><span class="channel" id="channel" hidden>DEV @COMMIT@</span></h1>
  <p class="intro" data-i18n="web_play_intro"></p>
  <nav class="channels" id="channels" hidden>
    <p class="label" data-i18n="web_channels"></p>
    <div class="choice">
      <a id="channel-release" data-i18n-title="web_channel_release_title"><span data-i18n="web_channel_release"></span><small></small></a>
      <a id="channel-dev" data-i18n-title="web_channel_dev_title"><span data-i18n="web_channel_dev"></span><small></small></a>
    </div>
  </nav>
  <p class="label" data-i18n="web_emulators"></p>
  <div class="cores">
    <a class="core panel" href="sameboy/"><div><b>SameBoy</b><span>Game Boy, Game Boy Color, Super Game Boy</span></div><span class="go" data-i18n="web_play"></span></a>
    <a class="core panel" href="snes9x/"><div><b>Snes9x</b><span>Super Nintendo, Super Famicom</span></div><span class="go" data-i18n="web_play"></span></a>
    <a class="core panel" href="piccobots/"><div><b>piccobots</b><span data-i18n="web_demo_description"></span></div><span class="go" data-i18n="web_play"></span></a>
  </div>
  <section class="companion" id="piccoletto" hidden>
    <h2 data-i18n="web_companion_title"></h2>
    <p data-i18n="web_companion_intro"></p>
    <a class="core panel" href="piccoletto/"><div><b>piccoletto</b><span data-i18n="web_companion_description"></span></div><span class="go" data-i18n="web_open"></span></a>
  </section>
  <p id="drop-hint" data-i18n="web_chooser_drop" hidden></p>
  <div class="notes">
    <p data-i18n="web_play_controls"></p>
    <p><span data-i18n="web_licenses"></span> (<a href="LICENSES/">LICENSES/</a>).</p>
  </div>
</main>
<!-- sites-footer filled in by web/package.sh -->
<!-- /sites-footer -->
<script src="piccolo-web-strings.js"></script>
<script src="piccolo-text.js"></script>
<script>
  // The dev channel (every push to main) says so; a release says nothing.
  if (document.body.dataset.channel === 'dev') {
    document.getElementById('channel').hidden = false;
  }
  // RELEASE | DEV: a site with both builds has channels.json at its top
  // (web/channels.sh), which is this folder for one build and the parent for
  // the other. Paths in it are relative to it. A lone build has none.
  function piccolo_channels_show(channels, base) {
    const here = document.body.dataset.channel === 'dev' ? 'dev' : 'release';
    for (const name of ['release', 'dev']) {
      const link = document.getElementById('channel-' + name);
      const entry = channels[name];
      if (!entry) {   // no release yet: greyed out, says so
        link.removeAttribute('href');
        link.setAttribute('aria-disabled', 'true');
        link.dataset.i18nTitle = 'web_channel_none_title';
        link.title = piccolo_web_text('web_channel_none_title');
        continue;
      }
      link.href = new URL(entry.path, base).href;
      link.querySelector('small').textContent = entry.label || '';
      if (name === here) {
        link.setAttribute('aria-current', 'page');
      }
    }
    document.getElementById('channels').hidden = false;
  }
  function piccolo_channels_find(paths) {
    if (paths.length === 0) {
      return;
    }
    const base = new URL(paths[0], location.href);
    fetch(base).then(function (response) {
      if (!response.ok) {
        throw new Error('none here');
      }
      return response.json();
    }).then(function (channels) {
      piccolo_channels_show(channels, base);
    }).catch(function () {
      piccolo_channels_find(paths.slice(1));
    });
  }
  piccolo_channels_find(['channels.json', '../channels.json']);
  // piccoletto is listed only when this site has it (web/package.sh with PICCOLETTO).
  fetch('piccoletto/manifest.webmanifest', { method: 'HEAD' }).then(function (response) {
    document.getElementById('piccoletto').hidden = !response.ok;
  }).catch(function () {});
  // A game dropped here would make the browser open or download it: say
  // where it goes instead.
  window.addEventListener('dragover', function (event) { event.preventDefault(); });
  window.addEventListener('drop', function (event) {
    event.preventDefault();
    document.getElementById('drop-hint').hidden = false;
  });
</script>
</body>
</html>
