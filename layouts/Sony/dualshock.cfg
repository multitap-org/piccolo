# DualShock 3 / 4: cross at the bottom, circle on the right.
[layout]
name = DUALSHOCK
order = 20
sdl_types = ps3 ps4
dpad = yes
sticks = 2

[labels]
# The face buttons are the pixel font's glyphs ✕ ○ □ △ (U+2715, U+25CB, U+25A1, U+25B3).
a = ✕
b = ○
x = □
y = △
leftshoulder = L1
rightshoulder = R1
lefttrigger = L2
righttrigger = R2
back = SHARE
start = OPTIONS
guide = PS
leftstick = L3
rightstick = R3
