# Super Nintendo joypad (and SNES-style pads like the 8BitDo SN30):
# B at the bottom, A on the right; no sticks, triggers or HOME.
[layout]
name = SUPER NINTENDO JOYPAD
order = 30
dpad = yes
sticks = 0
# The touch pad's MINIMAL arrangement (the face buttons a 3 x 3 cross like
# the d-pad, L and R level) and the games a touch pad STYLE of AUTO gives it to.
touch = snes
extensions = sfc smc swc fig bs st

[labels]
a = B
b = A
x = Y
y = X
leftshoulder = L
rightshoulder = R
back = SELECT
start = START
