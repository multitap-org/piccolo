# NES controller and the Game Boy's buttons (and NES-style pads like the
# 8BitDo N30): B on the left, A on the right; no sticks, shoulders or HOME.
# As a touch pad STYLE, a thumb between B and A presses both.
[layout]
name = NES / GAME BOY
order = 29
dpad = yes
sticks = 0
# The touch pad's MINIMAL arrangement (B and A big, on a slant) and the games
# a touch pad STYLE of AUTO gives it to.
touch = two
extensions = nes fds unf unif gb gbc dmg sgb

[labels]
a = B
b = A
back = SELECT
start = START
